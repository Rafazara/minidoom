name: Firmware

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "fix/**"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18

      - name: Build game firmware
        run: pio run -e esp32doit-devkit-v1

      - name: Build OLED diagnostic firmware
        run: pio run -e esp32doit-devkit-v1-oled-diag

      - name: Run native tests
        run: pio test -e native
